# Grouped: minor/patch bundle into one monthly PR per ecosystem; majors come individually for review.
version: 2
updates:
- package-ecosystem: maven
  directory: /
  schedule:
    interval: monthly
  open-pull-requests-limit: 5
  ignore:
  - dependency-name: io.trino:trino-spi
    versions:
    - '>=440'
  - dependency-name: io.airlift:slice
    versions:
    - '>=2.3'
  groups:
    maven-minor-patch:
      patterns:
      - '*'
      update-types:
      - minor
      - patch
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: monthly
  groups:
    github-actions-minor-patch:
      patterns:
      - '*'
      update-types:
      - minor
      - patch
